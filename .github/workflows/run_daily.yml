name: 每日股票监控
on:
  schedule:
    # 目标：收盘后尽快收到准确数据（15:30-18:00执行）
    # GitHub Actions 有~4-5h调度延迟，反推 cron 时间
    # UTC 03:30 = 北京 11:30，加上延迟 → 实际执行 15:25-18:20
    - cron: '30 3 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏃 运行股票脚本
        run: python stock_profit.py
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
