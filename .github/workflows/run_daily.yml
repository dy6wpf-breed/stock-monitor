name: 每日股票监控
on:
  schedule:
    # GitHub Actions cron 有~5h调度延迟(免费计划已知问题)
    # 设 UTC 02:05 = 北京 10:05，加上平均~5h延迟 → 实际执行约北京 15:00-15:30 (收盘后)
    - cron: '5 2 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏃 运行股票脚本
        run: python stock_profit.py
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
